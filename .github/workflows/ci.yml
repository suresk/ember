name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt and clippy.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The tests assert trained losses to four decimals, and those digits depend on the
  # platform's exp and tanh, so for now they run where the book's numbers were computed.
  # The ci/matrix branch runs them on Linux and Windows as well (see the README).
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace --no-fail-fast
